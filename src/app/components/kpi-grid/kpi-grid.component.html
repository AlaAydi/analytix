<section class="kpi-grid">
  <div *ngFor="let kpi of kpis" class="glass-card kpi-card" [ngClass]="kpi.color">
    <div class="kpi-header">
      <span class="kpi-title">{{ kpi.title }}</span>
      <div class="kpi-icon-wrapper">
        <svg *ngIf="kpi.iconName === 'currency-dollar'" class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23" />
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        <svg *ngIf="kpi.iconName === 'users'" class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <svg *ngIf="kpi.iconName === 'activity'" class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
        <svg *ngIf="kpi.iconName === 'trending-up'" class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
          <polyline points="17 6 23 6 23 12" />
        </svg>
      </div>
    </div>
    
    <div class="kpi-body">
      <h2 class="kpi-value">{{ kpi.value }}</h2>
      <div class="kpi-trend" [class.positive]="kpi.isPositive" [class.negative]="!kpi.isPositive">
        <svg class="trend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline *ngIf="kpi.isPositive" points="18 15 12 9 6 15" />
          <polyline *ngIf="!kpi.isPositive" points="6 9 12 15 18 9" />
        </svg>
        <span>{{ kpi.change }}</span>
        <span class="trend-text">vs mois préc.</span>
      </div>
    </div>

    <div class="kpi-sparkline">
      <svg viewBox="0 0 120 40" class="sparkline-svg">
        <path [attr.d]="getSparklinePath(kpi.sparkline)" 
              fill="none" 
              [attr.stroke]="getKpiColorHex(kpi.color)" 
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round" />
      </svg>
    </div>
  </div>
</section>
