<div class="dashboard-container" [class.theme-dark]="isDarkMode" [class.theme-light]="!isDarkMode">
  <!-- Animated Sidebar Component -->
  <app-sidebar
    [activeTab]="activeTab"
    [userName]="userName"
    [userRole]="userRole"
    (tabChange)="setActiveTab($event)">
  </app-sidebar>

  <!-- Main Section -->
  <main class="main-content" id="dashboard-content">
    <!-- Animated Toolbar Header Component -->
    <app-header
      [activeTab]="activeTab"
      [lastUpdated]="lastUpdated"
      [isLiveSync]="isLiveSync"
      [dateFilter]="dateFilter"
      [isDarkMode]="isDarkMode"
      (toggleLiveSync)="toggleLiveSync()"
      (dateFilterChange)="onFilterChange($event)"
      (toggleTheme)="toggleTheme()"
      (exportPdf)="exportPDF()">
    </app-header>

    <!-- Tab View Container with Angular Tab Transition Animation -->
    <div class="content-body" [@fadeScaleTab]="activeTab">

      <!-- PROFILE TAB -->
      <ng-container *ngIf="activeTab === 'profile'">
        <app-profile-editor
          [userName]="userName"
          [userEmail]="userEmail"
          [userRole]="userRole"
          [userCompany]="userCompany"
          [userLocation]="userLocation"
          [userBio]="userBio"
          [userTimezone]="userTimezone"
          (saveProfile)="saveProfile($event)"
          (cancelEdit)="setActiveTab('dashboard')">
        </app-profile-editor>
      </ng-container>

      <!-- PRODUCTS TAB -->
      <ng-container *ngIf="activeTab === 'products'">
        <app-product-management></app-product-management>
      </ng-container>

      <!-- ORDERS TAB -->
      <ng-container *ngIf="activeTab === 'orders'">
        <app-orders-sales></app-orders-sales>
      </ng-container>

      <!-- NOTIFICATIONS TAB -->
      <ng-container *ngIf="activeTab === 'notifications'">
        <app-notifications-feed></app-notifications-feed>
      </ng-container>

      <!-- USERS TAB -->
      <ng-container *ngIf="activeTab === 'users'">
        <app-team-users></app-team-users>
      </ng-container>

      <!-- SUPPORT TAB -->
      <ng-container *ngIf="activeTab === 'support'">
        <app-support-tickets></app-support-tickets>
      </ng-container>

      <!-- OVERVIEW TAB -->
      <ng-container *ngIf="activeTab === 'dashboard'">
        <app-quick-actions (actionSelected)="runQuickAction($event)"></app-quick-actions>
        <app-kpi-grid [kpis]="kpis"></app-kpi-grid>

        <section class="charts-grid">
          <div class="glass-card chart-card main-chart-card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Flux de Trésorerie</h3>
                <p class="card-subtitle">Analyse comparative des revenus et dépenses du compte</p>
              </div>
            </div>
            <div class="card-body chart-wrapper">
              <app-chart [type]="revenueChartType" [data]="revenueChartData" [options]="revenueChartOptions"></app-chart>
            </div>
          </div>

          <div class="secondary-charts">
            <div class="glass-card chart-card sub-chart-card">
              <div class="card-header">
                <h3 class="card-title">Canaux d'Acquisition</h3>
              </div>
              <div class="card-body chart-wrapper doughnut-wrapper">
                <app-chart [type]="trafficChartType" [data]="trafficChartData" [options]="trafficChartOptions"></app-chart>
              </div>
            </div>

            <div class="glass-card chart-card sub-chart-card">
              <div class="card-header">
                <h3 class="card-title">Croissance des Comptes</h3>
              </div>
              <div class="card-body chart-wrapper">
                <app-chart [type]="growthChartType" [data]="growthChartData" [options]="growthChartOptions"></app-chart>
              </div>
            </div>
          </div>
        </section>

        <app-transaction-table [transactions]="filteredTransactions" (exportCsv)="exportCSV()"></app-transaction-table>
      </ng-container>

      <!-- ANALYTICS TAB -->
      <ng-container *ngIf="activeTab === 'analytics'">
        <app-analytics-view
          [activeAnalyticsMetric]="activeAnalyticsMetric"
          [analyticsChartType]="analyticsChartType"
          [analyticsChartData]="analyticsChartData"
          [analyticsChartOptions]="analyticsChartOptions"
          [deviceChartType]="deviceChartType"
          [deviceChartData]="deviceChartData"
          [deviceChartOptions]="deviceChartOptions"
          [countries]="countries"
          (metricChange)="setAnalyticsMetric($event)">
        </app-analytics-view>
      </ng-container>

      <!-- REPORTS TAB -->
      <ng-container *ngIf="activeTab === 'reports'">
        <app-reports-view
          [reportType]="reportType"
          [reportFormat]="reportFormat"
          [reportOptions]="reportOptions"
          [isGeneratingReport]="isGeneratingReport"
          [generationProgress]="generationProgress"
          [generatedReports]="generatedReports"
          [userName]="userName"
          [lastUpdated]="lastUpdated"
          [dateFilterLabel]="getFilterLabel()"
          [dateFilter]="dateFilter"
          (reportTypeChange)="reportType = $event"
          (reportFormatChange)="reportFormat = $event"
          (generateReport)="generateReport()"
          (downloadReport)="downloadReport($event)">
        </app-reports-view>
      </ng-container>

      <!-- SETTINGS TAB -->
      <ng-container *ngIf="activeTab === 'settings'">
        <app-settings-view
          [userName]="userName"
          [userEmail]="userEmail"
          [userRole]="userRole"
          [enableSound]="enableSound"
          [isDarkMode]="isDarkMode"
          [refreshInterval]="refreshInterval"
          [apiKeys]="apiKeys"
          [showApiKeys]="showApiKeys"
          [apiTesting]="apiTesting"
          [apiStatus]="apiStatus"
          [systemLogs]="systemLogs"
          (saveProfile)="saveProfile()"
          (toggleTheme)="toggleTheme()"
          (enableSoundChange)="enableSound = $event"
          (refreshIntervalChange)="refreshInterval = $event"
          (testApiConnection)="testApiConnection($event)"
          (toggleApiKeyVisibility)="toggleApiKeyVisibility($event)"
          (purgeCache)="purgeCache()"
          (exportBackup)="exportBackup()">
        </app-settings-view>
      </ng-container>

    </div>
  </main>

  <!-- Animated Toast Notification Component -->
  <app-toast-notification [message]="toastMessage" [show]="showToast"></app-toast-notification>
</div>
