<header class="dashboard-header" [@slideDownHeader]>
  <div class="header-left">
    <h1 class="page-title" *ngIf="activeTab === 'dashboard'">Tableau de bord</h1>
    <h1 class="page-title" *ngIf="activeTab === 'analytics'">Analyses de l'audience</h1>
    <h1 class="page-title" *ngIf="activeTab === 'reports'">Centre de rapports</h1>
    <h1 class="page-title" *ngIf="activeTab === 'products'">Gestion des produits</h1>
    <h1 class="page-title" *ngIf="activeTab === 'orders'">Commandes et ventes</h1>
    <h1 class="page-title" *ngIf="activeTab === 'notifications'">Notifications et activité</h1>
    <h1 class="page-title" *ngIf="activeTab === 'users'">Utilisateurs et rôles</h1>
    <h1 class="page-title" *ngIf="activeTab === 'support'">Support et tickets</h1>
    <h1 class="page-title" *ngIf="activeTab === 'profile'">Profil utilisateur</h1>
    <h1 class="page-title" *ngIf="activeTab === 'settings'">Configuration du système</h1>
    <p class="page-subtitle">Dernière mise à jour : {{ lastUpdated | date:'HH:mm:ss' }}</p>
  </div>

  <div class="header-actions">
    <!-- Live Sync Toggle -->
    <div class="sync-switch" [class.active]="isLiveSync" (click)="onLiveSyncToggle()" title="Simulation en temps réel">
      <svg class="sync-icon" [class.spinning]="isLiveSync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      <span>Temps Réel</span>
      <div class="toggle-track">
        <div class="toggle-thumb"></div>
      </div>
    </div>

    <!-- Date Range Filter -->
    <div class="filter-dropdown">
      <select [ngModel]="dateFilter" (ngModelChange)="onFilterChange($event)" class="glass-select">
        <option value="1d">Aujourd'hui</option>
        <option value="7d">7 derniers jours</option>
        <option value="30d">30 derniers jours</option>
        <option value="90d">90 derniers jours</option>
      </select>
    </div>

    <!-- Theme Toggle -->
    <button class="action-btn theme-toggle" (click)="onThemeToggle()" title="Basculer le thème">
      <svg *ngIf="isDarkMode" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg *ngIf="!isDarkMode" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <!-- Export PDF -->
    <button class="btn btn-primary btn-export" (click)="onExportPdf()">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      <span>Capture PDF</span>
    </button>
  </div>
</header>
